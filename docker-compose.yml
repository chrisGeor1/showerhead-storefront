services:
  postgres:
    image: postgres:16-alpine
    container_name: vortex-postgres
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortex
    ports:
      - '5435:5432'
    volumes:
      - vortex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vortex']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vortex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vortex
      MINIO_ROOT_PASSWORD: vortex-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - vortex_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vortex-backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_API_URL: http://localhost:4000
      CLIENT_ORIGIN: http://localhost:5173
      ADMIN_ORIGIN: http://localhost:5174
      DATABASE_URL: postgresql://vortex:vortex@postgres:5432/vortex
      JWT_SECRET: dev-only-change-this-in-a-real-deployment-32chars
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000/vortex-media
      STORAGE_BUCKET: vortex-media
      STORAGE_ACCESS_KEY: vortex
      STORAGE_SECRET_KEY: vortex-secret
      ADMIN_SEED_EMAIL: admin@vortex.local
      ADMIN_SEED_PASSWORD: change-me-please
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ['full']

volumes:
  vortex_pgdata:
  vortex_minio_data:
